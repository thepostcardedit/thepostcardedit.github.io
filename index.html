  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://thepostcardedits.com/#organization",
    "name": "The Postcard Edit",
    "alternateName": "The Postcard Edit",
    "description": "London walks, cafés, places, pop-ups, culture and everyday discoveries — collected since 2013.",
    "url": "https://thepostcardedits.com/",
    "foundingDate": "2013",
    "sameAs": [
      "https://www.instagram.com/the_postcard_edit/",
      "https://bsky.app/profile/thepostcardedit.bsky.social",
      "https://www.pinterest.com/the_postcard_edit/",
      "https://thepostcardedit.substack.com/",

      "https://www.threads.com/@the_postcard_edit",

      "https://x.com/thepostcardedit",

    ]
  }
  </script>

  <style>
    .page-content {
      max-width: 980px;
      margin: 0 auto;
      padding: 60px 6vw 80px;
    }

    .home-page {
      max-width: 760px;
      margin: 0 auto;
    }

    .article-header {
      margin: 0 0 42px;
    }

    .home-page h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.12;
      margin: 0 0 20px;
      font-weight: 600;
    }

    .article-intro {
      font-size: 1.35rem;
      line-height: 1.45;
      margin: 0;
    }

    .latest-posts {
      padding-top: 30px;
      border-top: 1px solid var(--line, rgba(28, 43, 58, 0.18));
    }

    .latest-posts h2 {
      font-size: 1.3rem;
      margin: 0 0 8px;
      font-weight: 600;
    }

    /* Cards are created by the script below from blog.html */
    #latest-posts .work-card {
      display: block;
      padding: 22px 0;
      border-bottom: 1px solid var(--line, rgba(28, 43, 58, 0.18));
      text-decoration: none;
    }

    #latest-posts .work-card .tag {
      display: block;
      padding: 0;
      border: 0;
      margin: 0 0 8px;
      font-family: 'Courier Prime', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.07em;
    }

    #latest-posts .work-card h3 {
      font-size: 1.2rem;
      line-height: 1.3;
      margin: 0 0 10px;
      font-weight: 600;
    }

    #latest-posts .work-card:hover h3,
    #latest-posts .work-card:focus h3 {
      text-decoration: underline;
    }

    #latest-posts .work-card p {
      font-size: 1rem;
      margin: 0;
    }

    .all-posts {
      margin: 28px 0 0;
      font-family: 'Courier Prime', monospace;
      font-size: 0.82rem;
    }

    @media (max-width: 600px) {
      .page-content {
        padding-top: 45px;
      }
    }
  </style>
</head>

<body>

  <!-- Shared site header -->
  <div id="site-header"></div>

  <main class="page-content">
    <div class="home-page">

      <header class="article-header">
        <h1>The Postcard Edit</h1>
        <p class="article-intro">A personal collection of London cafés, walks, pop-ups, culture and everyday discoveries | Est. 2013</p>
      </header>

      <section class="latest-posts">

        <h2>Latest posts</h2>

        <div id="latest-posts">
          <!-- Latest blog posts are loaded automatically from blog.html -->
        </div>

        <p class="all-posts"><a href="/blog.html">View all blog posts →</a></p>

      </section>

    </div>
  </main>

  <!-- Shared footer elements -->
  <div data-footer-include="/includes/footer-social.html"></div>

  <div data-footer-include="/includes/footer-copyright.html"></div>

  <script src="/js/header.js" defer></script>
  <script src="/js/footer.js" defer></script>

  <!-- Loads the latest three posts from blog.html (same logic as the original index) -->
  <script>
    fetch('/blog.html')
      .then(response => response.text())
      .then(text => {
        const doc = new DOMParser().parseFromString(text, 'text/html');
        const posts = doc.querySelectorAll('.blog-card');
        const container = document.getElementById('latest-posts');

        Array.from(posts).slice(0, 3).forEach(post => {
          const card = document.createElement('a');
          card.className = 'work-card';
          card.href = post.getAttribute('href');

          const date = post.querySelector('.date');
          const title = post.querySelector('h3');
          const description = post.querySelector('p');

          card.innerHTML = `
            ${date ? `<span class="tag">${date.textContent.trim()}</span>` : ''}
            ${title ? `<h3>${title.innerHTML}</h3>` : ''}
            ${description ? `<p>${description.innerHTML}</p>` : ''}
          `;

          container.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('latest-posts').innerHTML =
          '<p>Latest posts are available on the blog.</p>';
      });
  </script>

</body>
</html>
